name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Tap self
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/hironow"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/hironow/homebrew-tap"

      - name: Audit casks
        run: |
          casks=$(ls Casks/*.rb 2>/dev/null || true)
          if [ -z "$casks" ]; then
            echo "No casks found yet - skipping audit"
          else
            for f in Casks/*.rb; do
              name=$(basename "$f" .rb)
              echo "Auditing cask $name..."
              brew audit --cask "hironow/tap/$name" || exit 1
            done
          fi

      - name: Audit formulae
        run: |
          formulae=$(ls Formula/*.rb 2>/dev/null || true)
          if [ -z "$formulae" ]; then
            echo "No formulae found - skipping"
          else
            for f in Formula/*.rb; do
              name=$(basename "$f" .rb)
              echo "Auditing formula $name..."
              brew audit --formula "hironow/tap/$name" || exit 1
            done
          fi

      - name: Style check
        run: |
          for dir in Casks Formula; do
            files=$(ls $dir/*.rb 2>/dev/null || true)
            if [ -n "$files" ]; then
              brew style $dir/
            fi
          done
