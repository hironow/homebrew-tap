name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tap self
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/hironow"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/hironow/homebrew-tap"

      - name: Audit casks
        run: |
          casks=$(ls Casks/*.rb 2>/dev/null || true)
          if [ -z "$casks" ]; then
            echo "No casks found yet - skipping audit"
          else
            for f in Casks/*.rb; do
              name=$(basename "$f" .rb)
              echo "Auditing cask $name..."
              brew audit --cask "hironow/tap/$name" || exit 1
            done
          fi

      - name: Audit formulae
        run: |
          formulae=$(ls Formula/*.rb 2>/dev/null || true)
          if [ -z "$formulae" ]; then
            echo "No formulae found - skipping"
          else
            for f in Formula/*.rb; do
              name=$(basename "$f" .rb)
              echo "Auditing formula $name..."
              brew audit --formula "hironow/tap/$name" || exit 1
            done
          fi

      - name: Style check (Formula)
        run: |
          files=$(ls Formula/*.rb 2>/dev/null || true)
          if [ -n "$files" ]; then
            brew style Formula/
          fi

      - name: Style check (Casks, non-blocking)
        run: |
          files=$(ls Casks/*.rb 2>/dev/null || true)
          if [ -n "$files" ]; then
            brew style Casks/ || echo "::warning::Cask style issues detected (GoReleaser-generated, non-blocking)"
          fi
